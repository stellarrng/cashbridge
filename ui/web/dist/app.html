<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CashBridge workspace</title>
<meta name="theme-color" content="#16181a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2316181a'/%3E%3Cpath d='M5 22h4v-5M27 22h-4v-5M9 17c3.5-6 10.5-6 14 0' stroke='%23c5a059' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<script src="/assets/i18n.js"></script>
<link rel="stylesheet" href="/assets/base.css">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<header class="top">
  <a class="logo" href="/?stay=1" aria-label="CashBridge home">
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="currentColor"/><path d="M5 22h4v-5M27 22h-4v-5M9 17c3.5-6 10.5-6 14 0" stroke="var(--bridge)" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>
    <span>CashBridge</span>
  </a>
  <span class="portal-tag" id="portalTag">SME workspace</span>
  <div class="top-right">
    <span class="case" id="caseTag"></span>
    <div id="langSwitch"></div>
    <button class="icon-btn" type="button" id="themeBtn"></button>
    <button class="btn small ghost" type="button" id="assistantBtn" data-i18n="app.assistant" hidden>Assistant</button>
    <div class="me" id="me"></div>
    <button class="btn small ghost" type="button" id="switchBtn" data-i18n="app.switch">Switch account</button>
    <button class="btn small ghost" type="button" id="logoutBtn" data-i18n="app.logout">Sign out</button>
  </div>
</header>
<div class="shell">
  <nav class="side" id="side" aria-label="Sections"></nav>
  <main class="page" id="page" tabindex="-1"><p class="muted">Loading…</p></main>
</div>

<aside class="drawer" id="drawer" aria-label="CFO assistant" hidden>
  <div class="drawer-head">
    <h2 data-i18n="chat.title">CFO assistant</h2>
    <button class="btn small ghost" type="button" id="drawerClose" data-i18n="chat.close">Close</button>
  </div>
  <p class="muted small">Answers come from the forecast and funding engines and cite their source. It reads, it never acts.</p>
  <div class="chat" id="chat" aria-live="polite"></div>
  <form class="chat-form" id="chatForm">
    <label class="sr-only" for="chatInput">Ask a question</label>
    <input class="input" id="chatInput" placeholder="When do we run short, and what is the cheapest fix?" required>
    <button class="btn bridge" type="submit" data-i18n="chat.ask">Ask</button>
  </form>
  <div class="suggest" id="suggest"></div>
</aside>

<div class="modal" id="otpModal" role="dialog" aria-modal="true" aria-labelledby="otpTitle" hidden>
  <div class="modal-box">
    <h2 id="otpTitle" data-i18n="otp.title">Approve with a one-time code</h2>
    <p class="muted" id="otpInfo"></p>
    <p class="hashline"><span data-i18n="otp.bound">Bound to action</span> <span class="mono" id="otpHash"></span></p>
    <label class="field"><span data-i18n="otp.code">6-digit code from your authenticator</span><input id="otpCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}"></label>
    <p class="muted small" id="otpHelp"></p>
    <p class="err" id="otpErr" role="alert"></p>
    <div class="row">
      <button class="btn bridge" type="button" id="otpApprove" data-i18n="otp.approve">Approve and submit</button>
      <button class="btn ghost" type="button" id="otpCancel" data-i18n="otp.cancel">Cancel</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="/assets/config.js"></script>
<script src="/assets/api.js"></script>
<script src="/assets/charts.js"></script>
<script src="/assets/app.js"></script>
</body>
</html>
