[pytest]
testpaths = tests
addopts = -q
markers =
    slow: end-to-end evidence runs (trust scorecard); skipped by `make test-fast`
    e2e: real-browser tests (Playwright + Chromium, starts a server); run with `make e2e`
# Dump every thread's stack if a single test runs longer than this, so a hang is diagnosable, not silent.
faulthandler_timeout = 300
