# CashBridge — compose file for the parts that exist.
#
# The previous version defined a `cashbridge-ui` service on port 8501 and a
# `cashbridge-api` service running `uvicorn api.main:app` on port 8000. Neither
# `ui/app.py` nor `api/main.py` exists (see README §0), so both services
# crash-looped under `restart: unless-stopped` — which looks worse to a reviewer
# than having no compose file at all.
#
# The UI and API service definitions are kept below, commented out, as the
# intended deployment shape. Uncomment each one when its code lands.

services:
  cashbridge-core:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cashbridge-core
    environment:
      - DEMO_MODE=true
    volumes:
      - ./data:/app/data
    # One-shot walkthrough, not a long-running service: do not restart it.
    restart: "no"

