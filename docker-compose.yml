services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cashbridge
    ports:
      - "8000:8000"
    environment:
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - OTP_SECRET=${OTP_SECRET:-}
    volumes:
      - runtime:/app/data/runtime
    restart: unless-stopped

volumes:
  runtime:
