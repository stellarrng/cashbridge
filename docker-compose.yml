services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cashbridge
    ports:
      - "8000:8000"
    environment:
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - OTP_SECRET=${OTP_SECRET:-}
      - CASHBRIDGE_ENV=${CASHBRIDGE_ENV:-demo}
      - CASHBRIDGE_SESSION_SECRET=${CASHBRIDGE_SESSION_SECRET:-}
      - CASHBRIDGE_TRUST_PROXY=${CASHBRIDGE_TRUST_PROXY:-}
      - CASHBRIDGE_VAULT_KEY=${CASHBRIDGE_VAULT_KEY:-}
      - CASHBRIDGE_SESSION_STORE=${CASHBRIDGE_SESSION_STORE:-}
      - CASHBRIDGE_LENDER_ADAPTER=${CASHBRIDGE_LENDER_ADAPTER:-mock}
      - CASHBRIDGE_LENDER_BASE_URL=${CASHBRIDGE_LENDER_BASE_URL:-}
      - CASHBRIDGE_LENDER_API_KEY=${CASHBRIDGE_LENDER_API_KEY:-}
      - CASHBRIDGE_LENDER_WEBHOOK_SECRET=${CASHBRIDGE_LENDER_WEBHOOK_SECRET:-}
    volumes:
      - runtime:/app/data/runtime
    restart: unless-stopped

volumes:
  runtime:
