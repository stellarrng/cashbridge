version: "3.8"

services:
  cashbridge-ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cashbridge-ui
    ports:
      - "8501:8501"
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_HEADLESS=true
      - DEMO_MODE=true
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  cashbridge-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cashbridge-api
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      - DEMO_MODE=true
    volumes:
      - ./data:/app/data
    restart: unless-stopped
